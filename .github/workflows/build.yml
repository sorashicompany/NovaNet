name: build
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Vendor upstream
        run: ./scripts/bootstrap-upstream.sh
      - name: Build WDTT engine
        working-directory: vendor/wdtt-go
        run: go build -trimpath ./...

name: build
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - name: Validate shell scripts
        run: |
          bash -n scripts/bootstrap-upstream.sh
          bash -n scripts/install-termux.sh
          bash -n scripts/novanet
      - name: Vendor upstream
        run: bash ./scripts/bootstrap-upstream.sh
      - name: Download Go modules
        working-directory: vendor/wdtt-go
        run: go mod download
      - name: Build WDTT engine
        working-directory: vendor/wdtt-go
        run: go build -trimpath -buildvcs=false ./...
      - name: Build single binary
        working-directory: vendor/wdtt-go
        run: go build -trimpath -buildvcs=false -ldflags='-s -w' -o /tmp/novanet-engine .
      - name: Smoke test CLI parser
        run: |
          test -x scripts/novanet
          ./scripts/novanet profile list >/dev/null
